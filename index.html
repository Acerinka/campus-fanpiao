<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fcfaf7"><meta name="description" content="饭票校园食堂点评，按口味、预算和等候时间找到今天想吃的那道菜。">
  <title>饭票 · 校园食堂点评</title>
  <link rel="icon" href="icon.svg?v=3" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=8"><script defer src="app.js?v=6"></script>
</head>
<body>
<header id="discover"><div class="navwrap"><a class="brand" href="#discover" aria-label="饭票首页"><img src="icon.svg?v=3" alt=""><span><strong>饭票</strong><small>FANPIAO</small></span></a>
<nav aria-label="主导航"><a href="#discover" id="nav-discover">首页</a><a href="#saved" id="nav-saved">想吃清单 <span id="saved-count"></span></a></nav>
</div></header>
<main>
<section class="hero" id="hero" aria-label="校园午餐指南">
  <div class="poster"><div class="poster-inner">
    <div class="hero-copy">
      <h1>今天吃什么<span>？</span></h1>
      <p>看看同学怎么评，再决定去哪个窗口。</p>
      <div class="hero-actions">
        <button class="redbtn" id="browse">看校园菜单 <span aria-hidden="true">↓</span></button>
        <button class="draw-button" id="draw"><i data-i="dice"></i>随机挑一道</button>
      </div>
    </div>
    <figure class="dish-print">
      <img src="dish-1.jpg" width="508" height="508" alt="酱汁红烧肉配卤蛋、青菜和米饭" fetchpriority="high">
      <figcaption>
        <div><strong>招牌红烧肉饭</strong><small>东苑食堂 · 一楼 03 窗口</small></div>
        <b><span>¥</span>12</b>
      </figcaption>
    </figure>
  </div></div>
</section>
<section class="menu" id="menu" aria-labelledby="menuheading"><div class="sectionhead"><div class="section-title"><div><div class="eyebrow" id="section-kicker">CANTEEN MENU</div><h2 id="menuheading" tabindex="-1">校园菜单</h2></div></div><label class="search"><i data-i="search"></i><input id="search" type="search" placeholder="搜菜名、食堂或窗口" aria-label="搜菜名、食堂或窗口"></label></div>
  <div class="hall-strip"><div class="hall-inner" role="group" aria-labelledby="hall-title">
    <span class="hall-label" id="hall-title"><i data-i="pin"></i>选食堂</span>
    <button class="hall-button" data-hall="东苑"><img src="hall-rice.svg" alt="">东苑食堂<span aria-hidden="true">›</span></button>
    <button class="hall-button" data-hall="北区"><img src="hall-noodles.svg" alt="">北区食堂<span aria-hidden="true">›</span></button>
    <button class="hall-button" data-hall="南园"><img src="hall-steamer.svg" alt="">南园食堂<span aria-hidden="true">›</span></button>
  </div></div>
<div class="filters"><div id="chips" class="chips" aria-label="快捷筛选"></div><button id="filter-open" class="filterbtn"><i data-i="sliders"></i><span>筛选</span></button></div>
<div class="resultmeta"><div class="result-summary"><span id="results" aria-live="polite"></span><button id="clear-selection" data-reset hidden>清除条件</button></div><label>排序<select id="sort" aria-label="菜品排序"><option value="default">综合推荐</option><option value="rating">评分最高</option><option value="price">价格最低</option><option value="queue">等候最短</option></select></label></div>
<div id="cards" class="cards"></div></section>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog><div id="toast" role="status"></div>
</body></html>
